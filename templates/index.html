<!DOCTYPE html>
<html>
<head>
    <title>Live Streaming Demo</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Live Streaming Demo</h1>
        
        <div class="upload-container">
            <div class="upload-section">
                <h3>Upload Source Image</h3>
                <input type="file" id="imageUpload" accept="image/*">
                <p class="upload-status" id="imageStatus"></p>
            </div>
            
            <div class="upload-section">
                <h3>Upload Audio File (Optional)</h3>
                <input type="file" id="audioUpload" accept="audio/*">
                <p class="upload-status" id="audioStatus"></p>
            </div>
        </div>

        <div class="stream-container">
            <div class="video-container">
                <canvas id="videoCanvas"></canvas>
            </div>
            <div class="controls">
                <button id="startButton">Start Streaming</button>
            </div>
            <p class="status" id="statusText">Status: Ready</p>
        </div>
    </div>

    <script src="{{ url_for('static', path='/app.js') }}"></script>
</body>
</html>
