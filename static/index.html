<!-- static/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio-Video Processor</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .preview-container {
        max-width: 500px;
        margin: 20px auto;
      }
      #videoPreview {
        width: 100%;
        margin-top: 20px;
      }
      .upload-section {
        border: 2px dashed #ccc;
        padding: 20px;
        text-align: center;
        margin: 20px 0;
        border-radius: 5px;
      }
      .progress {
        display: none;
        margin: 20px 0;
      }
      #videoPreview {
        background-color: #000;
        aspect-ratio: 16/9;
        max-width: 100%;
        margin: 20px auto;
      }
      .preview-container {
        max-width: 800px;
        margin: 20px auto;
        background-color: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Audio-Video Processor</h1>

      <div class="row">
        <div class="col-md-6">
          <div class="upload-section">
            <h3>Image Upload</h3>
            <input
              type="file"
              id="imageInput"
              accept="image/*"
              class="form-control"
            />
            <div id="imagePreview" class="preview-container"></div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="upload-section">
            <h3>Audio Upload</h3>
            <input
              type="file"
              id="audioInput"
              accept="audio/*"
              class="form-control"
            />
            <div id="audioPreview" class="preview-container">
              <audio
                id="audioPlayer"
                controls
                style="display: none; width: 100%"
              ></audio>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button id="processButton" class="btn btn-primary btn-lg" disabled>
          Process
        </button>
      </div>

      <div class="progress">
        <div
          class="progress-bar progress-bar-striped progress-bar-animated"
          role="progressbar"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
          style="width: 0%"
        ></div>
      </div>

      <div class="preview-container">
        <video
          id="videoPreview"
          controls
          autoplay
          style="display: none; width: 100%; background: #000"
          playsinline
        ></video>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
  </body>
</html>
