<!-- static/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Stream</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .preview-container {
        max-width: 500px;
        margin: 20px auto;
      }
      #videoPreview {
        width: 100%;
        margin-top: 20px;
      }
      .upload-section {
        border: 2px dashed #ccc;
        padding: 20px;
        text-align: center;
        margin: 20px 0;
        border-radius: 5px;
      }
      .progress {
        display: none;
        margin: 20px 0;
      }
      #videoPreview {
        background-color: #000;
        aspect-ratio: 16/9;
        max-width: 100%;
        margin: 20px auto;
      }
      .preview-container {
        max-width: 800px;
        margin: 20px auto;
        background-color: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <h1 class="text-center mb-4">Live Stream</h1>

      <div class="row">
        <div class="col-md-6">
          <div class="upload-section">
            <h3>Image Preview</h3>
            <img id="videoFrame" style="width: 640px; height: 480px" />
          </div>
        </div>

        <div class="col-md-6">
          <div class="upload-section">
            <h3>Audio Preview</h3>
            <audio id="audioPlayer" autoplay></audio>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button id="processButton" class="btn btn-primary btn-lg" disabled>
          Process
        </button>
      </div>

      <div class="progress">
        <div
          class="progress-bar progress-bar-striped progress-bar-animated"
          role="progressbar"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
          style="width: 0%"
        ></div>
      </div>

      <div class="preview-container">
        <video
          id="videoPreview"
          controls
          autoplay
          style="display: none; width: 100%; background: #000"
          playsinline
        ></video>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const videoFrame = document.getElementById("videoFrame");
      const audioPlayer = document.getElementById("audioPlayer");
      const audioContext = new (window.AudioContext ||
        window.webkitAudioContext)();

      const evtSource = new EventSource("/stream");

      evtSource.onmessage = async function (event) {
        const data = JSON.parse(event.data);

        // Update video frame
        videoFrame.src = `data:image/jpeg;base64,${data.frame}`;

        // Play audio
        const audioBuffer = base64ToArrayBuffer(data.audio);
        const audioSource = audioContext.createBufferSource();
        audioSource.buffer = await audioContext.decodeAudioData(audioBuffer);
        audioSource.connect(audioContext.destination);
        audioSource.start();
      };

      function base64ToArrayBuffer(base64) {
        const binaryString = window.atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
      }
    </script>
  </body>
</html>
